services:
  tws:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ibkr-tws-prod
    ports:
      - "5901:5900"  # VNC
    secrets:
      - tws
    restart: unless-stopped
    # Bind-mount the entire TWS data directory to the host. Everything
    # TWS writes to /home/tws/jts (encrypted log files, the keys archive,
    # settings, jts.ini, ...) ends up in ~/src/ibkr/jts/ on the host.
    # The host user MUST have uid 1000 (matching the in-container `tws`
    # user) for this to be writable. See README "Setup" section.
    volumes:
      - ./jts:/home/tws/jts
    environment:
      - DISPLAY=:0
      - TZ=Asia/Jerusalem
    shm_size: '1g'  # Chromium's POSIX shared memory backend crashes
                    # with "No space left on device" at the default 64MB
                    # once >~1k fonts are indexed for fontconfig.

secrets:
  tws:
    file: ./docker/tws.secrets